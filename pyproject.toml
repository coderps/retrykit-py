[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "retrykit-py"
version = "0.1.0"
description = "A tiny Python retry library with safe defaults."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "coderps" }
]
maintainers = [
  { name = "coderps" }
]
keywords = ["retry", "backoff", "asyncio"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/coderps/retrykit-py"
Repository = "https://github.com/coderps/retrykit-py"
Issues = "https://github.com/coderps/retrykit-py/issues"

[project.optional-dependencies]
dev = ["build>=1", "pytest>=7", "twine>=4"]

[tool.setuptools.packages.find]
include = ["retrykit*"]

[tool.setuptools.package-data]
retrykit = ["py.typed"]
